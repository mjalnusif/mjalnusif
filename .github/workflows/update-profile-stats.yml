name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          USERNAME="${{ github.repository_owner }}"
          followers=$(gh api "/users/$USERNAME" --jq '.followers')
          repos=$(gh api "/users/$USERNAME" --jq '.public_repos')
          stars=$(gh api --paginate "/users/$USERNAME/repos?per_page=100&type=owner" --jq '.[].stargazers_count' | awk '{sum+=$1} END {print sum+0}')

          cat > github-stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="495" height="195">
            <rect width="100%" height="100%" rx="12" fill="#0d1117"/>
            <text x="25" y="42" fill="#e6edf3" font-family="Arial" font-size="22" font-weight="bold">mjalnusif's GitHub Stats</text>
            <text x="25" y="87" fill="#8b949e" font-family="Arial" font-size="16">Public repositories</text>
            <text x="25" y="115" fill="#58a6ff" font-family="Arial" font-size="25">$repos</text>
            <text x="190" y="87" fill="#8b949e" font-family="Arial" font-size="16">Followers</text>
            <text x="190" y="115" fill="#58a6ff" font-family="Arial" font-size="25">$followers</text>
            <text x="325" y="87" fill="#8b949e" font-family="Arial" font-size="16">Stars earned</text>
            <text x="325" y="115" fill="#58a6ff" font-family="Arial" font-size="25">$stars</text>
            <text x="25" y="165" fill="#8b949e" font-family="Arial" font-size="13">Updated automatically from GitHub’s API</text>
          </svg>
          EOF

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
